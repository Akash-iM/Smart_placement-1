{% extends 'base.html' %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Reset link sent</h4>
        <p class="text-muted">If this email is registered, you will receive a password reset link shortly.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary">Return to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
