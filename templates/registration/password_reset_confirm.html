{% extends 'base.html' %}

{% block title %}Enter New Password{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">Set a new password</h4>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Reset password</button></form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
