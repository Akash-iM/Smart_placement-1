{% extends 'base.html' %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in-up delay-1 mb-5">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-4 p-4 mt-3" style="background: rgba(255, 255, 255, 0.95);">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark mb-0"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Edit Profile</h2>
                <a class="btn btn-outline-secondary rounded-pill shadow-sm" href="{% url 'students:student_list' %}"><i class="fa-solid fa-arrow-left me-1"></i>Back</a>
            </div>
            
            <form method="post" enctype="multipart/form-data" novalidate class="custom-form mt-2">
                {% csrf_token %}
                {{ form.as_p|safe }}
                <hr class="my-4 border-light">
                <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm" type="submit" style="letter-spacing: 1px;">Update Record</button>
            </form>
        </div>
    </div>
</div>

<style>
    .custom-form p { margin-bottom: 1.5rem; }
    .custom-form label { font-weight: 700; color: #495057; margin-bottom: 0.5rem; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    .custom-form input, .custom-form select { border-radius: 12px; border: 1px solid #dee2e6; transition: all 0.2s; }
    .custom-form input:focus { box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15); border-color: #8db5fc; background-color: #fff !important; }
</style>
{% endblock %}
