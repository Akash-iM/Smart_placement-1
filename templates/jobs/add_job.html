{% extends 'base.html' %}
{% block title %}{% if job %}Edit Job{% else %}Post New Job{% endif %}{% endblock %}

{% block content %}
<div class="container fade-in-up mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-primary text-white border-0 py-4 px-4 rounded-top-4">
                    <h3 class="fw-bold mb-0"><i class="fas fa-briefcase me-2"></i>{% if job %}Edit Job Details{% else %}Post a New Opportunity{% endif %}</h3>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Job Title *</label>
                                <input type="text" name="title" class="form-control bg-light px-3 py-2 border-0" value="{{ job.title }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Company *</label>
                                <input type="text" name="company" class="form-control bg-light px-3 py-2 border-0" value="{{ job.company }}" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Location</label>
                                <input type="text" name="location" class="form-control bg-light px-3 py-2 border-0" value="{{ job.location }}" placeholder="e.g. Bangalore, Remote">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Salary / Package</label>
                                <input type="text" name="salary" class="form-control bg-light px-3 py-2 border-0" value="{{ job.salary }}" placeholder="e.g. 15 LPA">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Minimum CGPA Required *</label>
                                <input type="number" step="0.01" name="required_cgpa" class="form-control bg-light px-3 py-2 border-0" value="{{ job.required_cgpa|default:'0.00' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Application Deadline *</label>
                                <input type="date" name="deadline" class="form-control bg-light px-3 py-2 border-0" value="{{ job.deadline|date:'Y-m-d' }}" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-bold">Required Skills</label>
                                <input type="text" name="required_skills" class="form-control bg-light px-3 py-2 border-0" value="{{ job.required_skills }}" placeholder="e.g. Python, Django, React">
                                <div class="form-text">Comma separated list of skills.</div>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-bold">Job Description *</label>
                                <textarea name="description" class="form-control bg-light px-3 py-2 border-0" rows="6" required>{{ job.description }}</textarea>
                            </div>
                            
                            <div class="col-12 mt-5 text-end">
                                <a href="{% url 'students:job_list' %}" class="btn btn-light px-4 rounded-pill me-2 fw-bold">Cancel</a>
                                <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm fw-bold">{% if job %}Save Changes{% else %}Publish Job{% endif %}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
